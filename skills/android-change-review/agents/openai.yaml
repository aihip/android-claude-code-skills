interface:
  display_name: "Android Change Review"
  short_description: "Review staged/commit Android changes for crash risks"
  default_prompt: "Use $android-change-review to review my staged changes or a specific commit for crash risks, boundary conditions, and regressions."

policy:
  allow_implicit_invocation: true

# Trigger examples (for implicit invocation matching):
# - "review staged changes"
# - "review commit abc1234"
# - "code review after coding"
# - "检查当前修改代码"
# - "边界条件检查 / 崩溃风险检查"

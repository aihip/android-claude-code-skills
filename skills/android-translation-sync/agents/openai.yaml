interface:
  display_name: "Android Translation Sync"
  short_description: "Sync Android strings.xml translations from Excel"
  default_prompt: "Use $android-translation-sync to sync an Excel translation sheet into Android values*/strings.xml files and write generated keys back to Excel."

policy:
  allow_implicit_invocation: true

# Trigger examples (for implicit invocation matching):
# - "sync translations from excel"
# - "update android strings from excel"
# - "please sync: ./translations/strings.xlsx"
# - "多语言翻译同步"
# - "更新strings.xml"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3DDC84;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad1)"/>

  <!-- Android Logo -->
  <circle cx="600" cy="200" r="60" fill="#3DDC84"/>
  <rect x="570" y="140" width="60" height="20" rx="5" fill="#3DDC84"/>
  <rect x="570" y="240" width="60" height="20" rx="5" fill="#3DDC84"/>
  <circle cx="580" cy="190" r="8" fill="#1a1a2e"/>
  <circle cx="620" cy="190" r="8" fill="#1a1a2e"/>
  <rect x="590" y="220" width="20" height="15" rx="3" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">Android Claude Code Skills</text>

  <!-- Subtitle -->
  <text x="600" y="410" font-family="Arial, sans-serif" font-size="28" fill="#a0a0a0" text-anchor="middle">AI-Powered Android Development</text>

  <!-- Badges -->
  <g transform="translate(350, 460)">
    <!-- Claude Code -->
    <rect x="0" y="0" width="140" height="40" rx="8" fill="#3B82F6"/>
    <text x="70" y="26" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Claude Code</text>

    <!-- Codex -->
    <rect x="160" y="0" width="140" height="40" rx="8" fill="#10B981"/>
    <text x="230" y="26" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Codex</text>

    <!-- Gemini -->
    <rect x="320" y="0" width="140" height="40" rx="8" fill="#F59E0B"/>
    <text x="390" y="26" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Gemini CLI</text>

    <!-- Cursor -->
    <rect x="480" y="0" width="140" height="40" rx="8" fill="#8B5CF6"/>
    <text x="550" y="26" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Cursor</text>
  </g>

  <!-- Features -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="20" fill="#a0a0a0" text-anchor="middle">
    Code Review • APK Analysis • Figma-to-Android • Translation Sync • Project Analyzer
  </text>

  <!-- GitHub/Links -->
  <text x="1150" y="610" font-family="Arial, sans-serif" font-size="14" fill="#666666" text-anchor="end">github.com/aihip/android-claude-code-skills</text>
</svg>
